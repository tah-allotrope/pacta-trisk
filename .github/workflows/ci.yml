name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r dashboard/requirements.txt

      - name: Run Python tests
        run: python -m pytest dashboard/tests -v

  r-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.5"
          use-public-rspm: true

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev libssl-dev libxml2-dev

      - name: Restore R dependencies via renv
        uses: r-lib/actions/setup-renv@v2
        with:
          cache-version: 1

      - name: Verify pactatrisk package loads
        run: |
          Rscript -e "if (!requireNamespace('devtools', quietly = TRUE)) install.packages('devtools'); devtools::load_all('.'); cat('pactatrisk loads OK\n')"

      - name: Run R tests
        run: Rscript -e "testthat::test_dir('tests/testthat')"
