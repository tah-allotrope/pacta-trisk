name: Refresh pipeline data

on:
  workflow_dispatch: {}
  schedule:
    # Every Monday 02:00 UTC.
    - cron: "0 2 * * 1"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.5"
          use-public-rspm: true

      - name: Cache R library
        uses: actions/cache@v4
        with:
          path: ${{ env.R_LIBS_USER }}
          key: r-library-${{ runner.os }}-${{ hashFiles('scripts/ci/install_deps.R') }}
          restore-keys: |
            r-library-${{ runner.os }}-

      - name: Install system dependencies for R packages
        run: |
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev libssl-dev libxml2-dev libgdal-dev libudunits2-dev libuv1-dev

      - name: Install R dependencies
        run: Rscript scripts/ci/install_deps.R

      - name: Run pipeline refresh
        run: Rscript scripts/pipeline_refresh.R

      - name: Commit refreshed snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dashboard/data synthesis_output
          if git diff --cached --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "chore: automated pipeline refresh $(date -u +%Y-%m-%d)"
            git push
          fi
